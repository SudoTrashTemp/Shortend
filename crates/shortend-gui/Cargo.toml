[package]
name = "shortend-gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "shortend-gui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eframe = "0.33"
jiff = "0.2.38"
rfd = "0.15"
shortend-core = { version = "0.1.0", path = "../shortend-core" }

[dev-dependencies]
egui_kittest = "0.33"
shortend-core = { path = "../shortend-core", features = ["fault-injection"] }
tempfile = "3.27"
