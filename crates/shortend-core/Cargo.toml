[package]
name = "shortend-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
csv = "1.4.0"
jiff = { version = "0.2.38", features = ["serde"] }
md-5 = "0.11.0"
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha1 = "0.11.0"
sha2 = "0.11.0"
thiserror = "2.0.21"
toml = "1.1.8"
uuid = { version = "1.26.1", features = ["v7", "serde"] }
walkdir = "2.5.0"
xxhash-rust = { version = "0.8.19", features = ["xxh64", "xxh3"] }

[lints]
workspace = true

[target."cfg(unix)".dependencies]
rustix = { version = "1.1.5", features = ["fs", "system"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3.27.0"

[features]
# Test-only fault hooks (see engine/pipeline.rs `fault`). Never enabled in release builds.
fault-injection = []
