[package]
name = "shortend-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ctrlc = "3.5.2"
jiff = "0.2.38"
shortend-core = { version = "0.1.0", path = "../shortend-core" }

[lints]
workspace = true

[dev-dependencies]
shortend-core = { path = "../shortend-core", features = ["fault-injection"] }
tempfile = "3.27.0"

[[bin]]
name = "shortend"
path = "src/main.rs"
