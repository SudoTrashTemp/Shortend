name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install reference manifest tools
        shell: bash
        run: |
          pip install "ascmhl==1.2" "mhl-suite==1.3.1"
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y libxml2-utils poppler-utils qpdf; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install poppler qpdf; fi
          # Windows has no xmllint; everything else must be present so no check is skipped.
          if [ "$RUNNER_OS" != "Windows" ]; then echo "SHORTEND_REQUIRE_TOOLS=1" >> "$GITHUB_ENV"; fi
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test-output.txt
      - name: Surface test failures
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          grep -E -A4 "panicked at|^---- |FAILED|error\[" test-output.txt \
            | head -60 | while IFS= read -r line; do echo "::error title=test failure::${line//%/%25}"; done
      - name: Build (release)
        run: cargo build --workspace --release

  # Linux is the primary QA platform: real filesystems on loop devices, simulated hot-unplug
  # (device-mapper error target, lazy unmount), full disks, read-only remounts, permissions.
  linux-devices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs exfat-fuse dosfstools ntfs-3g dmsetup hfsprogs \
            libfuse3-dev fuse3 cmake zlib1g-dev libbz2-dev libattr1-dev
          # HFS+ lives in the extra modules package on cloud kernels.
          sudo apt-get install -y "linux-modules-extra-$(uname -r)" || true
          sudo modprobe -a loop dm_mod || true
          sudo modprobe -a exfat vfat ntfs3 hfsplus || true
      - name: Build APFS tools (mkapfs, apfs-fuse)
        run: |
          mkdir -p "$RUNNER_TEMP/apfs" && cd "$RUNNER_TEMP/apfs"
          git clone -q https://github.com/linux-apfs/apfsprogs.git && git -C apfsprogs checkout -q 3721463ba7f539e532907bc1d10ed5b9a97d0449
          make -C apfsprogs/mkapfs -j4 > /dev/null
          git clone -q --recursive https://github.com/sgan81/apfs-fuse.git && git -C apfs-fuse checkout -q 66b86bd525e8cb90f9012543be89b1f092b75cf3
          cmake -S apfs-fuse -B apfs-fuse/build > /dev/null && make -C apfs-fuse/build -j4 apfs-fuse > /dev/null
          echo "SHORTEND_MKAPFS=$RUNNER_TEMP/apfs/apfsprogs/mkapfs/mkapfs" >> "$GITHUB_ENV"
          echo "SHORTEND_APFS_FUSE=$RUNNER_TEMP/apfs/apfs-fuse/build/apfs-fuse" >> "$GITHUB_ENV"
      - name: Build tests
        run: cargo test -p shortend-cli --test linux_devices --no-run
      - name: Device tests (root)
        run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTFLAGS=$RUSTFLAGS" CARGO_TERM_COLOR=always GITHUB_ACTIONS=true \
            SHORTEND_PRIVILEGED_TESTS=1 SHORTEND_REQUIRE_ALL_FS=1 \
            SHORTEND_RESULTS_FILE="$PWD/device-results.txt" \
            "SHORTEND_MKAPFS=$SHORTEND_MKAPFS" "SHORTEND_APFS_FUSE=$SHORTEND_APFS_FUSE" \
            cargo test -p shortend-cli --test linux_devices -- --test-threads=1 --nocapture
      - name: Report device test results
        if: always()
        run: |
          [ -f device-results.txt ] || exit 0
          echo "::notice title=linux-devices ($(wc -l < device-results.txt) results)::$(sed ':a;N;$!ba;s/\n/%0A/g' device-results.txt)"
      - name: Restore target ownership for the cache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target

  # Memory stays bounded however large the file (PLAN.md M1 done criteria).
  memory-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Peak RSS for a 4 GB file to 2 destinations
        env:
          SHORTEND_RSS_TEST_GB: "4"
        run: cargo test --release -p shortend-cli peak_rss -- --ignored --nocapture
