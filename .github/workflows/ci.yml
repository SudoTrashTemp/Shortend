name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install reference manifest tools
        shell: bash
        run: |
          pip install "ascmhl==1.2" "mhl-suite==1.3.1"
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get update -q && sudo apt-get install -y libxml2-utils poppler-utils qpdf; fi
          if [ "$RUNNER_OS" = "macOS" ]; then brew install poppler qpdf; fi
          # Windows has no xmllint; everything else must be present so no check is skipped.
          if [ "$RUNNER_OS" != "Windows" ]; then echo "SHORTEND_REQUIRE_TOOLS=1" >> "$GITHUB_ENV"; fi
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace -- --nocapture 2>&1 | tee test-output.txt
      - name: Surface test failures
        if: failure()
        shell: bash
        run: |
          [ -f test-output.txt ] || exit 0
          grep -E "panicked at|^---- |^failures:|assertion|left:|right:|FAILED|error\[" test-output.txt \
            | head -60 | while IFS= read -r line; do echo "::error title=test failure::${line//%/%25}"; done
      - name: Build (release)
        run: cargo build --workspace --release

  # Linux is the primary QA platform: real filesystems on loop devices, simulated hot-unplug
  # (device-mapper error target, lazy unmount), full disks, read-only remounts, permissions.
  linux-devices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install filesystem tools
        run: |
          sudo apt-get update
          sudo apt-get install -y exfatprogs exfat-fuse dosfstools ntfs-3g dmsetup
          sudo modprobe -a loop dm_mod || true
          sudo modprobe -a exfat vfat ntfs3 || true
      - name: Build tests
        run: cargo test -p shortend-cli --test linux_devices --no-run
      - name: Device tests (root)
        run: |
          sudo env "PATH=$PATH" "RUSTUP_HOME=${RUSTUP_HOME:-$HOME/.rustup}" "CARGO_HOME=${CARGO_HOME:-$HOME/.cargo}" \
            "RUSTFLAGS=$RUSTFLAGS" CARGO_TERM_COLOR=always GITHUB_ACTIONS=true \
            SHORTEND_PRIVILEGED_TESTS=1 SHORTEND_REQUIRE_ALL_FS=1 \
            cargo test -p shortend-cli --test linux_devices -- --test-threads=1 --nocapture
      - name: Restore target ownership for the cache
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" target

  # Memory stays bounded however large the file (PLAN.md M1 done criteria).
  memory-bound:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Peak RSS for a 4 GB file to 2 destinations
        env:
          SHORTEND_RSS_TEST_GB: "4"
        run: cargo test --release -p shortend-cli peak_rss -- --ignored --nocapture
